<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Life Operator — Читалка</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}

/* ══ INTRO VIDEO ══ */
#introScreen{
  position:fixed;inset:0;z-index:300;
  background:#000;
  display:flex;align-items:center;justify-content:center;
}
#introVideo{
  width:100%;height:100%;
  object-fit:contain;
  background:#000;
}
#introFade{
  position:absolute;inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.5s ease-in;
}
#introFade.fading{opacity:1;}
#skipBtn{
  position:absolute;bottom:30px;right:24px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.6);
  padding:8px 18px;border-radius:20px;
  font-size:11px;letter-spacing:.1em;
  cursor:pointer;
  font-family:system-ui,sans-serif;
}

/* ══ READER ══ */
#readerScreen{
  position:fixed;inset:0;
  background:#1a1a1a;
  opacity:0;transition:opacity 1s;
  pointer-events:none;
}
#readerScreen.visible{opacity:1;pointer-events:all;}

/* ── BARS ── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:48px;
  background:rgba(0,0,0,.88);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:100;
  border-bottom:1px solid rgba(216,175,99,.12);
  transform:translateY(0);opacity:1;
  transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s;
}
.topbar.hidden{transform:translateY(-100%);opacity:0;}
.topbar-left{display:flex;flex-direction:column;}
.topbar-title{color:rgba(216,175,99,.7);font-size:10px;letter-spacing:.2em;text-transform:uppercase;}
.topbar-chapter{color:rgba(255,255,255,.35);font-size:9px;letter-spacing:.1em;margin-top:1px;}
.top-btns{display:flex;gap:6px;align-items:center;}
.top-btn{
  background:rgba(216,175,99,.08);border:1px solid rgba(216,175,99,.18);
  color:#d8af63;width:32px;height:32px;border-radius:8px;
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.top-btn:hover{background:rgba(216,175,99,.18);}
.atmo-btn{
  display:flex;align-items:center;gap:5px;
  background:rgba(216,175,99,.08);border:1px solid rgba(216,175,99,.18);
  color:#d8af63;padding:5px 12px;border-radius:16px;
  font-size:10px;letter-spacing:.1em;cursor:pointer;
  transition:background .2s;
}
.atmo-btn:hover{background:rgba(216,175,99,.18);}
.atmo-dot{width:5px;height:5px;border-radius:50%;background:#d8af63;opacity:.3;transition:opacity .3s;}
.atmo-btn.on .atmo-dot{opacity:1;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.7);opacity:.5}}

.bottombar{
  position:fixed;bottom:0;left:0;right:0;height:58px;
  background:rgba(0,0,0,.88);
  display:flex;align-items:center;justify-content:center;gap:20px;z-index:100;
  border-top:1px solid rgba(216,175,99,.1);
  transform:translateY(0);opacity:1;
  transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s;
}
.bottombar.hidden{transform:translateY(100%);opacity:0;}
.nav-btn{
  width:46px;height:46px;border-radius:50%;
  background:rgba(216,175,99,.08);border:1px solid rgba(216,175,99,.2);
  color:#d8af63;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.nav-btn:hover{background:rgba(216,175,99,.15);}
.nav-btn:disabled{opacity:.2;cursor:default;}
.pg-info{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.12em;min-width:60px;text-align:center;}

/* Progress */
.progress{
  position:fixed;bottom:58px;left:0;right:0;height:2px;
  background:rgba(255,255,255,.05);z-index:100;
  transition:bottom .35s cubic-bezier(.4,0,.2,1);
}
.progress.bars-hidden{bottom:0;}
.progress-fill{height:100%;background:#d8af63;opacity:.6;transition:width .4s;}

/* ── VIEWER ── */
.viewer{
  position:fixed;top:48px;bottom:58px;left:0;right:0;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#1a1a1a;
  transition:top .35s cubic-bezier(.4,0,.2,1),bottom .35s cubic-bezier(.4,0,.2,1);
}
.viewer.expanded{top:0;bottom:0;}

.page-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .5s cubic-bezier(.77,0,.175,1),opacity .4s;
}
.page-wrap.active{transform:translateX(0);opacity:1;z-index:2;}
.page-wrap.prev{transform:translateX(-100%);opacity:0;z-index:1;}
.page-wrap.next{transform:translateX(100%);opacity:0;z-index:1;}
.page-img{
  max-height:100%;max-width:100%;
  object-fit:contain;display:block;
  box-shadow:0 8px 40px rgba(0,0,0,.7);
  user-select:none;-webkit-user-select:none;
  transition:transform .15s;
}

/* ── LOCK PAGE ── */
.lock-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,8,6,.95);
  backdrop-filter:blur(4px);
}
.lock-box{
  text-align:center;padding:40px 28px;max-width:320px;
}
.lock-icon{font-size:44px;margin-bottom:16px;opacity:.6;}
.lock-title{
  font-family:Georgia,serif;
  color:#d8af63;font-size:18px;margin-bottom:8px;
}
.lock-text{
  color:rgba(255,255,255,.45);font-size:13px;line-height:1.7;margin-bottom:24px;
}
.lock-btn{
  background:#d8af63;color:#1a1408;border:none;
  padding:14px 32px;border-radius:30px;
  font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(216,175,99,.3);
  transition:transform .15s,box-shadow .15s;
}
.lock-btn:active{transform:scale(.97);}

/* ── LANG SELECTOR (показується якщо мова не обрана) ── */
#langModal{
  position:fixed;inset:0;z-index:400;
  background:#000;
  display:flex;align-items:center;justify-content:center;
}
.lang-btns{
  display:flex;gap:16px;align-items:center;justify-content:center;
  flex-wrap:wrap;padding:20px;
}
.lang-flag{
  background:rgba(216,175,99,.08);
  border:2px solid rgba(216,175,99,.3);
  color:#d8af63;
  font-size:22px;font-weight:800;
  letter-spacing:.08em;
  padding:18px 28px;
  border-radius:16px;
  cursor:pointer;
  transition:all .2s;
  display:flex;align-items:center;gap:10px;
}
.lang-flag:hover{
  background:rgba(216,175,99,.15);
  border-color:#d8af63;
  transform:scale(1.05);
}

/* ── FINALE VIDEO ── */
#finaleScreen{
  position:fixed;inset:0;z-index:300;
  background:#000;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;
}
#finaleScreen.show{display:flex;}
#finaleVideo{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;}
.finale-close{
  position:absolute;top:20px;right:20px;z-index:10;
  background:rgba(255,255,255,.1);border:none;
  color:#fff;width:40px;height:40px;border-radius:50%;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* === STAN ARI READER FIX v2: safe-area + desktop wheel zoom + drag pan === */
:root{
  --reader-safe-top: env(safe-area-inset-top, 0px);
  --reader-top-offset: 10px;
  --reader-topbar-height: 54px;
}
.topbar{
  top: calc(var(--reader-safe-top) + var(--reader-top-offset)) !important;
  height: var(--reader-topbar-height) !important;
}
.viewer{
  top: calc(var(--reader-safe-top) + var(--reader-top-offset) + var(--reader-topbar-height)) !important;
}
.viewer.expanded{
  top: 0 !important;
  bottom: 0 !important;
}
.site-back-btn{
  flex:0 0 auto !important;
}
.viewer.zoomed{
  cursor:grab !important;
}
.viewer.zoomed.dragging{
  cursor:grabbing !important;
}
.viewer.zoomed .page-img{
  cursor:grab !important;
}
.viewer.zoomed.dragging .page-img{
  cursor:grabbing !important;
}
.page-img{
  transform-origin:center center !important;
  will-change:transform !important;
}
@media(max-width:768px){
  :root{--reader-top-offset:14px;--reader-topbar-height:56px;}
  .topbar{padding-left:10px!important;padding-right:10px!important;}
  .site-back-btn{font-size:13px!important;padding:9px 13px!important;}
  .topbar-title{font-size:9px!important;letter-spacing:.15em!important;}
}
@media(max-width:420px){
  .site-back-btn{font-size:12px!important;padding:8px 11px!important;}
  .top-btn{width:30px!important;height:30px!important;}
  .atmo-btn{padding:5px 9px!important;}
}
/* === /STAN ARI READER FIX v2 === */

</style>
</head>
<body>

<!-- ══ LANG MODAL ══ -->
<div id="langModal">
  <div class="lang-btns">
    <button class="lang-flag" onclick="startReader('uk')">🇺🇦 UA</button>
    <button class="lang-flag" onclick="startReader('en')">🇬🇧 EN</button>
    <button class="lang-flag" onclick="startReader('pl')">🇵🇱 PL</button>
  </div>
</div>

<!-- ══ INTRO VIDEO ══ -->
<div id="introScreen" style="display:none;">
  <video id="introVideo" playsinline webkit-playsinline autoplay muted>
    <source src="video/book_intro.mp4" type="video/mp4">
  </video>
  <div id="introFade"></div>
  <button id="skipBtn" onclick="skipIntro()">Пропустити →</button>
</div>

<!-- ══ READER ══ -->
<div id="readerScreen">
  <div class="topbar" id="topbar">
    <div class="topbar-left" style="display:flex;align-items:center;gap:12px">
      <button class="site-back-btn" onclick="window.location.href='index.html'" style="background:linear-gradient(135deg,rgba(216,175,99,.35),rgba(216,175,99,.15));border:2px solid #d8af63;border-radius:10px;color:#f5e4a0;font-size:15px;font-weight:800;cursor:pointer;padding:10px 18px;line-height:1;letter-spacing:.5px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 12px rgba(216,175,99,.3)" title="Повернутись на сайт">← stanari.art</button>
      <div>
        <span class="topbar-title">The Life Operator · Tom 1</span>
        <span class="topbar-chapter" id="chapterLabel"></span>
      </div>
    </div>
    <div class="top-btns">
      <button class="top-btn" onclick="zoom(-0.2)" title="Зменшити">−</button>
      <button class="top-btn" onclick="zoom(0.2)" title="Збільшити">+</button>
      <button class="atmo-btn" id="atmoBtn" onclick="toggleAtmo()">
        <span class="atmo-dot"></span> 🎵
      </button>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <!-- Pages injected by JS -->
  </div>

  <div class="progress" id="progressBar">
    <div class="progress-fill" id="pFill"></div>
  </div>

  <div class="bottombar" id="bottombar">
    <button class="nav-btn" id="btnPrev" onclick="go(-1)" disabled>←</button>
    <span class="pg-info" id="pgInfo">1 / —</span>
    <button class="nav-btn" id="btnNext" onclick="go(1)">→</button>
  </div>
</div>

<!-- ══ AUDIO ══ -->
<audio id="atmoAudio" loop>
  <source src="audio/Black_Gold_Threshold.mp3" type="audio/mpeg">
</audio>
<audio id="finaleAudio">
  <source src="audio/STAN_ARI-ECHOES_OF_ARIA.mp3" type="audio/mpeg">
</audio>

<!-- ══ FINALE ══ -->
<div id="finaleScreen">
  <button class="finale-close" onclick="closeFinale()">✕</button>
  <video id="finaleVideo" controls playsinline>
    <!-- Якщо є відеокліп — src="video/finale_clip.mp4" -->
  </video>
</div>

<script>
// ── Config
const LANG_CONFIG = {
  uk: { total: 133, free: 42,  folder: 'pages/ua', label: 'Українська' },
  en: { total: 209, free: 63,  folder: 'pages/en', label: 'English' },
  pl: { total: 181, free: 63,  folder: 'pages/pl', label: 'Polski' },
};

const CHAPTER_LABELS = {
  uk: {1:'Пролог',5:'Блок II · Шум',7:'Глава 1 · Релігія',15:'Глава 2 · Первородний гріх',22:'Глава 3 · Дисонанс',30:'Глава 4 · Молитва'},
  en: {1:'Prologue',7:'Block II · Noise',10:'Chapter 1 · Religion',20:'Chapter 2 · Original Sin',35:'Chapter 3 · Dissonance',50:'Chapter 4 · Prayer'},
  pl: {1:'Prolog',7:'Blok II · Szum',10:'Rozdział 1 · Religia',20:'Rozdział 2 · Grzech pierworodny',35:'Rozdział 3 · Dysonans',50:'Rozdział 4 · Modlitwa'},
};

let lang = null;
let cur = 0;
let scale = 1;
let panX = 0, panY = 0;
let isPanning = false, panStartX = 0, panStartY = 0, panBaseX = 0, panBaseY = 0;
let barsVisible = true;
let hideTimer = null;
let atmoOn = false;
// Check access - only grant if valid purchase token exists
let hasAccess = false;
const accessToken = localStorage.getItem('stanari_book_access');
const accessLang = localStorage.getItem('stanari_access_lang');
// Only grant access if token is exactly 'true' AND was set by payment system
if (accessToken === 'granted_by_lemon') hasAccess = true;
let pages = [];

// ── Check saved language
const savedLang = localStorage.getItem('readerLang');
if (savedLang && LANG_CONFIG[savedLang]) {
  startReader(savedLang);
} else {
  // Show lang modal
  document.getElementById('langModal').style.display = 'flex';
}

// ── Start reader with chosen language
function startReader(l) {
  lang = l;
  localStorage.setItem('readerLang', l);
  document.getElementById('langModal').style.display = 'none';

  // Update buy button language in parent if exists
  try {
    const buyUrls = {
      uk: 'https://stanari.lemonsqueezy.com/checkout/buy/9756aa04-c8af-4df2-b9b9-7a95cc00d898',
      en: 'https://stanari.lemonsqueezy.com/checkout/buy/9756aa04-c8af-4df2-b9b9-7a95cc00d898',
      pl: 'https://stanari.lemonsqueezy.com/checkout/buy/9756aa04-c8af-4df2-b9b9-7a95cc00d898',
    };
    if (window.opener) {
      const buyBtn = window.opener.document.querySelector('[data-t="buy_main_btn"]');
      if (buyBtn) buyBtn.href = buyUrls[l];
    }
  } catch(e) {}

  // Play intro video
  playIntro();
}

// ── Intro video
function playIntro() {
  const intro = document.getElementById('introScreen');
  intro.style.display = 'flex';
  const video = document.getElementById('introVideo');
  video.play().catch(() => skipIntro());

  video.addEventListener('ended', () => {
    fadeAndStart();
  });

  // Safety timeout
  setTimeout(() => {
    if (document.getElementById('introScreen').style.display !== 'none') {
      fadeAndStart();
    }
  }, 10000);
}

function fadeAndStart() {
  document.getElementById('introFade').classList.add('fading');
  setTimeout(() => {
    document.getElementById('introScreen').style.display = 'none';
    initReader();
  }, 1500);
}

function skipIntro() {
  fadeAndStart();
}

// ── Init reader
function initReader() {
  const cfg = LANG_CONFIG[lang];
  const viewer = document.getElementById('viewer');

// ── Desktop wheel zoom + drag pan
viewer.addEventListener('wheel', e => {
  if (!document.getElementById('readerScreen').classList.contains('visible')) return;
  e.preventDefault();
  zoom(e.deltaY < 0 ? 0.15 : -0.15);
  showBars();
}, {passive:false});

viewer.addEventListener('mousedown', e => {
  if (scale <= 1.02 || e.button !== 0) return;
  isPanning = true;
  panStartX = e.clientX;
  panStartY = e.clientY;
  panBaseX = panX;
  panBaseY = panY;
  viewer.classList.add('dragging');
  showBars();
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!isPanning) return;
  panX = panBaseX + (e.clientX - panStartX);
  panY = panBaseY + (e.clientY - panStartY);
  clampPan();
  applyScale();
});

document.addEventListener('mouseup', () => {
  if (!isPanning) return;
  isPanning = false;
  viewer.classList.remove('dragging');
  applyScale();
});

  viewer.innerHTML = '';
  pages = [];

  // Build all pages
  for (let i = 1; i <= cfg.total; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap' + (i === 1 ? ' active' : ' next');
    wrap.dataset.page = i;

    const isLocked = !hasAccess && i > cfg.free;

    if (isLocked) {
      wrap.innerHTML = `
        <div class="lock-wrap">
          <div class="lock-box">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">${lang === 'uk' ? 'Глава 5 та далі' : lang === 'en' ? 'Chapter 5 onwards' : 'Rozdział 5 i dalej'}</div>
            <div class="lock-text">${lang === 'uk' ? 'Ви прочитали 4 безкоштовні глави. Купіть повний доступ щоб читати далі.' : lang === 'en' ? 'You have read 4 free chapters. Buy full access to continue reading.' : 'Przeczytałeś 4 darmowe rozdziały. Kup pełny dostęp, aby czytać dalej.'}</div>
            <button class="lock-btn" onclick="buyAccess()">${lang === 'uk' ? '🛒 Купити — 9.99 EUR' : lang === 'en' ? '🛒 Buy — 9.99 EUR' : '🛒 Kup — 9.99 EUR'}</button>
          </div>
        </div>`;
      // Only one lock page needed
      pages.push(wrap);
      break;
    } else {
      const img = document.createElement('img');
      img.className = 'page-img';
      img.src = `${cfg.folder}/p-${String(i).padStart(3,'0')}.png`;
      img.loading = i <= 3 ? 'eager' : 'lazy';
      img.draggable = false;
      wrap.appendChild(img);
      pages.push(wrap);
    }
  }

  pages.forEach(p => viewer.appendChild(p));

  document.getElementById('readerScreen').classList.add('visible');
  updateUI();
  startHideTimer();

  // Start atmosphere music
  setTimeout(() => {
    const audio = document.getElementById('atmoAudio');
    audio.volume = 0.35;
    audio.play().then(() => {
      atmoOn = true;
      document.getElementById('atmoBtn').classList.add('on');
    }).catch(() => {});
  }, 500);
}

// ── Navigation
function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= pages.length) return;
  scale = 1; panX = 0; panY = 0; applyScale();
  pages[cur].className = 'page-wrap ' + (dir > 0 ? 'prev' : 'next');
  cur = next;
  pages[cur].className = 'page-wrap active';
  updateUI();
  showBars();

  // Check if last page — play finale
  const cfg = LANG_CONFIG[lang];
  if (hasAccess && cur === pages.length - 1) {
    setTimeout(() => playFinale(), 1500);
  }
}

function updateUI() {
  const cfg = LANG_CONFIG[lang];
  const realPgNum = parseInt(pages[cur]?.dataset?.page || cur + 1);
  const pgNum = realPgNum + 1; // sync reader counter with printed PDF/PNG page number
  const total = hasAccess ? cfg.total : cfg.free + 1;

  document.getElementById('pgInfo').textContent = `${pgNum} / ${cfg.total}`;
  document.getElementById('pFill').style.width = (realPgNum / cfg.total * 100) + '%';
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === pages.length - 1;

  // Chapter label
  const labels = CHAPTER_LABELS[lang] || {};
  let chLabel = '';
  const nums = Object.keys(labels).map(Number).sort((a,b) => a-b);
  for (const n of nums) {
    if (pgNum >= n) chLabel = labels[n];
  }
  document.getElementById('chapterLabel').textContent = chLabel;
}

// ── Zoom
function zoom(d) {
  scale = Math.min(3, Math.max(0.5, scale + d));
  if (scale <= 1) { panX = 0; panY = 0; }
  clampPan();
  applyScale();
}
function applyScale() {
  const img = pages[cur]?.querySelector('.page-img');
  const viewerEl = document.getElementById('viewer');
  if (img) {
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    img.style.cursor = scale > 1.02 ? (isPanning ? 'grabbing' : 'grab') : 'default';
  }
  if (viewerEl) viewerEl.classList.toggle('zoomed', scale > 1.02);
}
function clampPan() {
  if (scale <= 1) { panX = 0; panY = 0; return; }
  const viewerEl = document.getElementById('viewer');
  const img = pages[cur]?.querySelector('.page-img');
  if (!viewerEl || !img) return;
  const maxX = Math.max(0, (img.clientWidth * scale - viewerEl.clientWidth) / 2) + 100;
  const maxY = Math.max(0, (img.clientHeight * scale - viewerEl.clientHeight) / 2) + 100;
  panX = Math.max(-maxX, Math.min(maxX, panX));
  panY = Math.max(-maxY, Math.min(maxY, panY));
}

// ── Auto-hide bars
function showBars() {
  if (!barsVisible) {
    barsVisible = true;
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('bottombar').classList.remove('hidden');
    document.getElementById('progressBar').classList.remove('bars-hidden');
    document.getElementById('viewer').classList.remove('expanded');
  }
  startHideTimer();
}
function hideBars() {
  barsVisible = false;
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('bottombar').classList.add('hidden');
  document.getElementById('progressBar').classList.add('bars-hidden');
  document.getElementById('viewer').classList.add('expanded');
}
function startHideTimer() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideBars, 3000);
}

['touchstart','mousemove','click'].forEach(ev => {
  document.addEventListener(ev, () => {
    if (document.getElementById('readerScreen').classList.contains('visible')) showBars();
  }, {passive: true});
});

// ── Pinch zoom
let initDist = 0, initScale = 1;
const viewer = document.getElementById('viewer');
viewer.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    initDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    initScale = scale;
  }
}, {passive: true});
viewer.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    scale = Math.min(3, Math.max(0.5, initScale * (d / initDist)));
    if (scale <= 1) { panX = 0; panY = 0; }
    clampPan();
    applyScale();
    e.preventDefault();
  }
}, {passive: false});

// ── Swipe + touch pan when zoomed
let tsx = 0, tsy = 0, startScale = 1, touchPanMoved = false;
viewer.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    tsx = e.touches[0].clientX;
    tsy = e.touches[0].clientY;
    startScale = scale;
    panBaseX = panX;
    panBaseY = panY;
    touchPanMoved = false;
  }
}, {passive: true});

viewer.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && scale > 1.02) {
    panX = panBaseX + (e.touches[0].clientX - tsx);
    panY = panBaseY + (e.touches[0].clientY - tsy);
    clampPan();
    applyScale();
    touchPanMoved = true;
    e.preventDefault();
  }
}, {passive:false});

viewer.addEventListener('touchend', e => {
  if (e.changedTouches.length === 1 && scale < 1.1 && !touchPanMoved) {
    const dx = e.changedTouches[0].clientX - tsx;
    const dy = e.changedTouches[0].clientY - tsy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    else showBars();
  }
}, {passive: true});

// ── Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === '+') zoom(0.2);
  if (e.key === '-') zoom(-0.2);
  if (e.key === 'Escape') window.history.back();
});
</script>
