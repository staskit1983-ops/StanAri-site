<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}

/* ══ INTRO VIDEO ══ */
#introScreen{
  position:fixed;inset:0;z-index:300;
  background:#000;
  display:flex;align-items:center;justify-content:center;
}
#introVideo{
  width:100%;height:100%;
  object-fit:contain;
  background:#000;
}
#introFade{
  position:absolute;inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.5s ease-in;
}
#introFade.fading{opacity:1;}
#skipBtn{
  position:absolute;bottom:30px;right:24px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.6);
  padding:8px 18px;border-radius:20px;
  font-size:11px;letter-spacing:.1em;
  cursor:pointer;
  font-family:system-ui,sans-serif;
}
#startIntroBtn{
  position:absolute;bottom:calc(34px + env(safe-area-inset-bottom, 0px));left:42%;transform:translateX(-50%);
  display:none;
  background:rgba(216,175,99,.16);
  border:1px solid rgba(216,175,99,.35);
  color:#d8af63;
  padding:10px 22px;border-radius:22px;
  font-size:12px;font-weight:800;letter-spacing:.08em;
  cursor:pointer;
  font-family:system-ui,sans-serif;
}

/* ══ READER ══ */
#readerScreen{
  position:fixed;inset:0;
  background:#1a1a1a;
  opacity:0;transition:opacity 1s;
  pointer-events:none;
}
#readerScreen.visible{opacity:1;pointer-events:all;}

/* ── BARS ── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:48px;
  background:rgba(0,0,0,.88);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:100;
  border-bottom:1px solid rgba(216,175,99,.12);
  transform:translateY(0);opacity:1;
  transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s;
}
.topbar.hidden{transform:translateY(-100%);opacity:0;}
.topbar-left{display:flex;flex-direction:column;}
.topbar-title{color:rgba(216,175,99,.7);font-size:10px;letter-spacing:.2em;text-transform:uppercase;}
.topbar-chapter{color:rgba(255,255,255,.35);font-size:9px;letter-spacing:.1em;margin-top:1px;}
.top-btns{display:flex;gap:6px;align-items:center;}
.top-btn{
  background:rgba(216,175,99,.08);border:1px solid rgba(216,175,99,.18);
  color:#d8af63;width:32px;height:32px;border-radius:8px;
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.top-btn:hover{background:rgba(216,175,99,.18);}
.atmo-btn{
  display:flex;align-items:center;gap:5px;
  background:rgba(216,175,99,.08);border:1px solid rgba(216,175,99,.18);
  color:#d8af63;padding:5px 12px;border-radius:16px;
  font-size:10px;letter-spacing:.1em;cursor:pointer;
  transition:background .2s;
}
.atmo-btn:hover{background:rgba(216,175,99,.18);}
.atmo-dot{width:5px;height:5px;border-radius:50%;background:#d8af63;opacity:.3;transition:opacity .3s;}
.atmo-btn.on .atmo-dot{opacity:1;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.7);opacity:.5}}

.bottombar{
  position:fixed;bottom:0;left:0;right:0;height:58px;
  background:rgba(0,0,0,.88);
  display:flex;align-items:center;justify-content:center;gap:20px;z-index:100;
  border-top:1px solid rgba(216,175,99,.1);
  transform:translateY(0);opacity:1;
  transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s;
}
.bottombar.hidden{transform:translateY(100%);opacity:0;}
.nav-btn{
  width:46px;height:46px;border-radius:50%;
  background:rgba(216,175,99,.08);border:1px solid rgba(216,175,99,.2);
  color:#d8af63;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.nav-btn:hover{background:rgba(216,175,99,.15);}
.nav-btn:disabled{opacity:.2;cursor:default;}
.pg-info{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.12em;min-width:60px;text-align:center;}

/* Progress */
.progress{
  position:fixed;bottom:58px;left:0;right:0;height:2px;
  background:rgba(255,255,255,.05);z-index:100;
  transition:bottom .35s cubic-bezier(.4,0,.2,1);
}
.progress.bars-hidden{bottom:0;}
.progress-fill{height:100%;background:#d8af63;opacity:.6;transition:width .4s;}

/* ── VIEWER ── */
.viewer{
  position:fixed;top:48px;bottom:58px;left:0;right:0;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#1a1a1a;
  transition:top .35s cubic-bezier(.4,0,.2,1),bottom .35s cubic-bezier(.4,0,.2,1);
}
.viewer.expanded{top:0;bottom:0;}

.page-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .5s cubic-bezier(.77,0,.175,1),opacity .4s;
}
.page-wrap.active{transform:translateX(0);opacity:1;z-index:2;}
.page-wrap.prev{transform:translateX(-100%);opacity:0;z-index:1;}
.page-wrap.next{transform:translateX(100%);opacity:0;z-index:1;}
.page-img{
  max-height:100%;max-width:100%;
  object-fit:contain;display:block;
  box-shadow:0 8px 40px rgba(0,0,0,.7);
  user-select:none;-webkit-user-select:none;
  transition:transform .15s;
}

/* ── LOCK PAGE ── */
.lock-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,8,6,.95);
  backdrop-filter:blur(4px);
}
.lock-box{
  text-align:center;padding:40px 28px;max-width:320px;
}
.lock-icon{font-size:44px;margin-bottom:16px;opacity:.6;}
.lock-title{
  font-family:Georgia,serif;
  color:#d8af63;font-size:18px;margin-bottom:8px;
}
.lock-text{
  color:rgba(255,255,255,.45);font-size:13px;line-height:1.7;margin-bottom:24px;
}
.lock-btn{
  background:#d8af63;color:#1a1408;border:none;
  padding:14px 32px;border-radius:30px;
  font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(216,175,99,.3);
  transition:transform .15s,box-shadow .15s;
}
.lock-btn:active{transform:scale(.97);}

/* ── LANG SELECTOR (показується якщо мова не обрана) ── */
#langModal{
  position:fixed;inset:0;z-index:400;
  background:#000;
  display:flex;align-items:center;justify-content:center;
}
.lang-btns{
  display:flex;gap:16px;align-items:center;justify-content:center;
  flex-wrap:wrap;padding:20px;

.lang-flag{
  background:rgba(216,175,99,.08);

  font-size:22px;font-weight:800;
  letter-spacing:.08em;

.lang-flag:hover{

/* ── FINALE VIDEO ── */

/* === STAN ARI READER FIX v12: safe-area + desktop wheel zoom + drag pan === */
:root{
  --reader-safe-top: env(safe-area-inset-top, 0px);
  --reader-top-offset: 10px;
  --reader-topbar-height: 54px;
}
.topbar{
  top: calc(var(--reader-safe-top) + var(--reader-top-offset)) !important;
  height: var(--reader-topbar-height) !important;
}
.viewer{
  top: calc(var(--reader-safe-top) + var(--reader-top-offset) + var(--reader-topbar-height)) !important;
}
.viewer.expanded{
  top: 0 !important;
  bottom: 0 !important;
}
.site-back-btn{
  flex:0 0 auto !important;
}
.viewer.zoomed{
  cursor:grab !important;
}
.viewer.zoomed.dragging{
  cursor:grabbing !important;
}
.viewer.zoomed .page-img{
  cursor:grab !important;
}
.viewer.zoomed.dragging .page-img{
  cursor:grabbing !important;
}
.page-img{
  transform-origin:center center !important;
  will-change:transform !important;
}
@media(max-width:768px){
  :root{--reader-top-offset:14px;--reader-topbar-height:56px;}
  .topbar{padding-left:10px!important;padding-right:10px!important;}

<script>
console.log("[STAN ARI] reader v20 auth/lemon swiss fix loaded");
// ── Config
const LANG_CONFIG = {
  uk: { total: 133, free: 42,  folder: 'pages/ua', label: 'Українська' },
  en: { total: 209, free: 63,  folder: 'pages/en', label: 'English' },
  pl: { total: 181, free: 63,  folder: 'pages/pl', label: 'Polski' },
};

const BOOK_TITLES = {
  uk: 'THE LIFE OPERATOR · TOM 1',
  en: 'THE LIFE OPERATOR · BOOK 1',
  pl: 'THE LIFE OPERATOR · TOM 1',
};

const CHAPTER_LABELS = {
  uk: {1:'Пролог',5:'Блок II · Шум',7:'Глава 1 · Релігія',15:'Глава 2 · Первородний гріх',22:'Глава 3 · Дисонанс',30:'Глава 4 · Молитва'},
  en: {1:'Prologue',7:'Block II · Noise',10:'Chapter 1 · Religion',20:'Chapter 2 · Original Sin',35:'Chapter 3 · Dissonance',50:'Chapter 4 · Prayer'},
  pl: {1:'Prolog',7:'Blok II · Szum',10:'Rozdział 1 · Religia',20:'Rozdział 2 · Grzech pierworodny',35:'Rozdział 3 · Dysonans',50:'Rozdział 4 · Modlitwa'},
};

let lang = null;
let cur = 0;
let scale = 1;
let panX = 0, panY = 0;
let isPanning = false, panStartX = 0, panStartY = 0, panBaseX = 0, panBaseY = 0;
let barsVisible = true;
let hideTimer = null;
let atmoOn = false;

function isInAppBrowser() {
  return /FBAN|FBAV|Instagram|Line|Twitter|TikTok|Telegram|Messenger/i.test(navigator.userAgent);
}

function isIOSReaderDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

let finalePlayed = false;

// ── Firebase / book access
let hasAccess = false;
let authUser = null;
let firebaseApi = null;
let accessChecked = false;
let pages = [];

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBsrWuWCILNHKy8jphyvszge7XWUbPwFdY",
  authDomain: "stanari-platform.firebaseapp.com",
  projectId: "stanari-platform",
  storageBucket: "stanari-platform.firebasestorage.app",
  messagingSenderId: "1083904103961",
  appId: "1:1083904103961:web:cd1fec10d11096c8f3fc88"
};

const LEMON_CHECKOUT_URL = 'https://stanari.lemonsqueezy.com/checkout/buy/9756aa04-c8af-4df2-b9b9-7a95cc00d898';
function buildLemonCheckoutUrl(email) {
  const url = new URL(LEMON_CHECKOUT_URL);
  const cleanEmail = (email || '').trim().toLowerCase();
  if (cleanEmail) {
    url.searchParams.set('checkout[email]', cleanEmail);
    url.searchParams.set('checkout[custom][firebase_email]', cleanEmail);
  }
  return url.toString();
}

function stanariCurrentAuthEmail() {
  // Firebase Auth is the only source of truth for the active account.
  // localStorage may contain an old email from another device/session, so it must never unlock or buy.
  return String(authUser && authUser.email ? authUser.email : '').trim().toLowerCase();
}

async function getFirebaseApi() {
  if (firebaseApi) return firebaseApi;
  const appMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const authMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
  const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

  let app;
  try {
    app = appMod.getApp();
  } catch (e) {
    app = appMod.initializeApp(FIREBASE_CONFIG);
  }
  const auth = authMod.getAuth(app);
  try { await authMod.setPersistence(auth, authMod.browserLocalPersistence); } catch(e) { console.warn('Auth persistence setup failed:', e); }
  const db = fsMod.getFirestore(app);
  const provider = new authMod.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  firebaseApi = { authMod, fsMod, auth, db, provider };
  return firebaseApi;
}

async function waitForAuthUser(timeoutMs = 2500) {
  const { authMod, auth } = await getFirebaseApi();
  if (auth.currentUser) return auth.currentUser;
  return await new Promise(resolve => {
    let done = false;
    const finish = user => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { unsub(); } catch(e) {}
      resolve(user || null);
    };
    const unsub = authMod.onAuthStateChanged(auth, finish);
    const timer = setTimeout(() => finish(auth.currentUser || null), timeoutMs);
  });
}

async function checkFirestoreBookAccess() {
  try {
    const { fsMod, db } = await getFirebaseApi();
    await handleRedirectLoginResult();
    authUser = await waitForAuthUser();

    // Access must be based on the currently authenticated Firebase user, not on a stale localStorage email.
    const email = (authUser && authUser.email ? authUser.email : '').trim().toLowerCase();
    if (!email) {
      hasAccess = false;
      accessChecked = true;
      return false;
    }

    console.log('[STAN ARI ACCESS] checking Firestore document:', `book_access/${email}`);
    const directRef = fsMod.doc(db, 'book_access', email);
    const directSnap = await fsMod.getDoc(directRef);
    if (directSnap.exists() && directSnap.data() && directSnap.data().access === true) {
      hasAccess = true;
      localStorage.setItem('stanari_book_access', 'granted_by_firestore');
      localStorage.setItem('stanari_access_email', email);
      localStorage.setItem('stanari_access_lang', 'all');
      console.log('[STAN ARI ACCESS] granted by book_access:', email);
      return true;
    }

    // Fallback for older promo/manual grants saved by uid in users/{uid}.
    if (authUser && authUser.uid) {
      const userRef = fsMod.doc(db, 'users', authUser.uid);
      const userSnap = await fsMod.getDoc(userRef);
      if (userSnap.exists() && userSnap.data() && userSnap.data().hasAccess === true) {
        hasAccess = true;
        localStorage.setItem('stanari_book_access', 'granted_by_users_uid');
        localStorage.setItem('stanari_access_email', email);
        localStorage.setItem('stanari_access_lang', 'all');
        console.log('[STAN ARI ACCESS] granted by users/{uid}:', authUser.uid);
        return true;
      }
    }
    hasAccess = false;
    localStorage.removeItem('stanari_book_access');
    localStorage.removeItem('stanari_access_email');
    console.log('[STAN ARI ACCESS] no access document found for:', email);
  } catch (err) {
    console.warn('Book access check failed:', err);
  } finally {
    accessChecked = true;
  }
  return hasAccess;
}

function stanariIsIOSLike() {
  const ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function shouldUseRedirectLogin() {
  // iPhone/Safari/mobile: use full-page redirect for login only.
  return stanariIsIOSLike() || /Android|Mobile/i.test(navigator.userAgent || '');
}

let redirectResultHandled = false;
async function handleRedirectLoginResult() {
  if (redirectResultHandled) return authUser || null;
  redirectResultHandled = true;
  try {
    const { authMod, auth } = await getFirebaseApi();
    const result = await authMod.getRedirectResult(auth);
    if (result && result.user) {
      authUser = result.user;
      return authUser;
    }
    authUser = auth.currentUser || authUser;
  } catch(e) {
    console.warn('Redirect login result failed:', e);
  }
  return authUser || null;
}

async function signInAndCheckAccess() {
  const { authMod, auth, provider } = await getFirebaseApi();
  provider.setCustomParameters({ prompt: 'select_account' });

  try {
    // Popup works on modern mobile browsers and avoids the broken
    // signInWithRedirect storage-partitioning issue (Chrome 115+/Safari ITP).
    const result = await authMod.signInWithPopup(auth, provider);
    authUser = result && result.user ? result.user : auth.currentUser;
  } catch (popupErr) {
    console.warn('Popup login failed, falling back to redirect:', popupErr);
    var code = popupErr && popupErr.code ? popupErr.code : '';
    if (code === 'auth/popup-blocked' || code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
      localStorage.setItem('stanari_login_from_lock', '1');

  video.setAttribute('muted', '');
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');

  const playPromise = video.play();
  if (playPromise && typeof playPromise.catch === 'function') {
    playPromise.catch(() => {
      // iOS / in-app browsers may block autoplay. Show manual start instead of skipping.
      showManualStart();
    });

  video.addEventListener('ended', () => {

  setTimeout(() => {
    if (document.getElementById('introScreen').style.display !== 'none' && video.paused) {
      showManualStart();

  setTimeout(() => {
    if (document.getElementById('introScreen').style.display !== 'none') {
      fadeAndStart();

  }, 12000);
}

// ── Desktop wheel zoom + drag pan
if (!readerPointerHandlersAttached) {
readerPointerHandlersAttached = true;

document.addEventListener('mouseup', () => {

  viewer.innerHTML = '';

function syncRenderedPagesForMemory() {
  if (!isIOSReaderDevice()) return;
  if (!pages || !pages.length || !lang) return;
  const cfg = LANG_CONFIG[lang];
  pages.forEach((wrap, idx) => {
    const pageNo = parseInt(wrap.dataset.page || (idx + 1), 10);
    const locked = wrap.querySelector('.lock-wrap');
    if (locked) return;

    const near = Math.abs(idx - cur) <= 2;
    const hasImg = !!wrap.querySelector('img.page-img');

    if (near && !hasImg) {
      const img = document.createElement('img');
      img.className = 'page-img';
      img.src = `${cfg.folder}/p-${String(pageNo).padStart(3,'0')}.png`;
      img.loading = Math.abs(idx - cur) <= 1 ? 'eager' : 'lazy';
      img.draggable = false;
      wrap.appendChild(img);
    }

    if (!near && hasImg) {
      wrap.innerHTML = '';
    }
  });
}

// ── Navigation
function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= pages.length) return;
  scale = 1; panX = 0; panY = 0; applyScale();
  pages[cur].className = 'page-wrap ' + (dir > 0 ? 'prev' : 'next');
  cur = next;
  pages[cur].className = 'page-wrap active';
  syncRenderedPagesForMemory();
  updateUI();
  showBars();

  // Check if last page — play finale
  const cfg = LANG_CONFIG[lang];
  if (hasAccess && cur === pages.length - 1 && !finalePlayed) {
    finalePlayed = true;
    setTimeout(() => playFinale(), 900);
  }
}

function updateUI() {
  const cfg = LANG_CONFIG[lang];
  const realPgNum = parseInt(pages[cur]?.dataset?.page || cur + 1);

  // PNG filenames are one step behind the printed page number visible inside the book.
  // Show the same page number the reader sees printed on the page, but never exceed total.
  const displayPgNum = Math.min(realPgNum + 1, cfg.total);

  document.getElementById('pgInfo').textContent = `${displayPgNum} / ${cfg.total}`;
  document.getElementById('pFill').style.width = (displayPgNum / cfg.total * 100) + '%';
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === pages.length - 1;

  // Keep the top bar clean and language-safe across UA / EN / PL.
  // The actual block/chapter title is printed inside the book page itself.
  document.getElementById('chapterLabel').textContent = '';
}

// ── Zoom
function zoom(d) {
  scale = Math.min(3, Math.max(0.5, scale + d));
  if (scale <= 1) { panX = 0; panY = 0; }
  clampPan();
  applyScale();
}
function applyScale() {
  syncRenderedPagesForMemory();
  const img = pages[cur]?.querySelector('.page-img');
  const viewerEl = document.getElementById('viewer');
  if (img) {
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    img.style.cursor = scale > 1.02 ? (isPanning ? 'grabbing' : 'grab') : 'default';
  }
  if (viewerEl) viewerEl.classList.toggle('zoomed', scale > 1.02);
}
function clampPan() {
  if (scale <= 1) { panX = 0; panY = 0; return; }
  const viewerEl = document.getElementById('viewer');
  const img = pages[cur]?.querySelector('.page-img');
  if (!viewerEl || !img) return;
  const maxX = Math.max(0, (img.clientWidth * scale - viewerEl.clientWidth) / 2) + 100;
  const maxY = Math.max(0, (img.clientHeight * scale - viewerEl.clientHeight) / 2) + 100;
  panX = Math.max(-maxX, Math.min(maxX, panX));
  panY = Math.max(-maxY, Math.min(maxY, panY));
}

// ── Auto-hide bars
function showBars() {
  if (!barsVisible) {
    barsVisible = true;
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('bottombar').classList.remove('hidden');

function hideBars() {

  document.getElementById('bottombar').classList.add('hidden');
  document.getElementById('progressBar').classList.add('bars-hidden');
  document.getElementById('viewer').classList.add('expanded');
}
function startHideTimer() {
  clearTimeout(hideTimer);

  // iPhone/iPad Safari and in-app browsers can crash/reload when fixed bars
  // are repeatedly hidden and the viewer is expanded after a few idle seconds.
  // Keep controls stable on iOS to prevent "Повторна помилка".
  if (isIOSReaderDevice()) return;

  hideTimer = setTimeout(hideBars, 3000);
}

['touchstart','mousemove','click'].forEach(ev => {

// ── Pinch zoom
let initDist = 0, initScale = 1;
const viewer = document.getElementById('viewer');
viewer.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    initDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    initScale = scale;
  }
}, {passive: true});
viewer.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    scale = Math.min(3, Math.max(0.5, initScale * (d / initDist)));
    if (scale <= 1) { panX = 0; panY = 0; }
    clampPan();
    applyScale();
    e.preventDefault();
  }
}, {passive: false});

// ── Swipe + touch pan when zoomed
let tsx = 0, tsy = 0, startScale = 1, touchPanMoved = false;
viewer.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    tsx = e.touches[0].clientX;
    tsy = e.touches[0].clientY;
    startScale = scale;
    panBaseX = panX;
    panBaseY = panY;
    touchPanMoved = false;
  }
}, {passive: true});

viewer.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && scale > 1.02) {
    panX = panBaseX + (e.touches[0].clientX - tsx);
    panY = panBaseY + (e.touches[0].clientY - tsy);
    clampPan();
    applyScale();
    touchPanMoved = true;
    e.preventDefault();
  }
}, {passive:false});

viewer.addEventListener('touchend', e => {
  if (e.changedTouches.length === 1 && scale < 1.1 && !touchPanMoved) {
    const dx = e.changedTouches[0].clientX - tsx;
    const dy = e.changedTouches[0].clientY - tsy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    else showBars();
  }
}, {passive: true});

// ── Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === '+') zoom(0.2);
  if (e.key === '-') zoom(-0.2);
  if (e.key === 'Escape') window.history.back();
});

if (new URLSearchParams(location.search).get('debugAccess') === '1') {
  setTimeout(async () => {
    await checkFirestoreBookAccess();
    console.log('[STAN ARI ACCESS v3]', { email: authUser && authUser.email, hasAccess, accessChecked });
  }, 1000);
}
